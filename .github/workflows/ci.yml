name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./cmd/taste
      - name: generated plugin is committed
        run: git diff --exit-code -- plugin dist || { echo "run 'go run ./cmd/taste' and commit"; exit 1; }
      - run: scripts/lazyspec-check.sh
      - name: plugin manifest validates
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate ./plugin
