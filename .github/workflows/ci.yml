name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: go vet ./...
      - run: go test ./...
      - name: every release target builds
        run: |
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go vet ./... || exit 1
          done
      - run: go run ./cmd/taste
      - name: generated plugin is committed
        run: git diff --exit-code -- plugin dist || { echo "run 'go run ./cmd/taste' and commit"; exit 1; }
      - run: scripts/lazyspec-check.sh
      - name: plugin manifest validates
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate ./plugin

  # The macOS app is tested against a wd built from the same commit, so the
  # wire both sides speak is checked on every push.
  macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: swift test
        working-directory: clients/macos

  # The Linux app is tested the same way, its model headless against a wd
  # built from this commit; the GTK app is linted and built.
  linux-app:
    env: { CARGO_TERM_COLOR: never }
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients/linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'rustfmt, clippy' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: clients/linux }
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: the release packaging builds
        working-directory: .
        run: |
          scripts/build-linux.sh
          dpkg-deb -c dist/Work-Director-dev-linux-*.deb | grep -q 'usr/lib/work-director/wd$'
          git clean -fdxq dist
      # Last, so a formatting slip never hides a failing test; the patch that
      # fixes it is kept with the run.
      - name: formatted as rustfmt formats it
        run: |
          cargo fmt --all
          git diff > "$RUNNER_TEMP/rustfmt.patch"
          git diff --exit-code --stat || { echo "run cargo fmt in clients/linux"; exit 1; }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: ${{ runner.temp }}/rustfmt.patch
          if-no-files-found: ignore

  # Windows runs the packages whose tests need no Unix shell: the ledger, the
  # state machine, projects, taste, review and delivery's link checks.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: go build ./...
      - run: go test ./internal/core/... ./internal/ledger/... ./internal/project/... ./internal/taste/... ./internal/review/... ./internal/judge/... ./internal/find/... ./internal/open/...
