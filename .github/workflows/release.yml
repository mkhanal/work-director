# Cut a release when a v* tag is pushed, and publish the binaries as a GitHub
# Release. This is how almost everyone installs wd — a downloaded tarball
# verified against a checksum — so it is part of the product, not a nicety.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  # Build provenance: each asset is attested as built by this workflow from
  # this tag, so an install can check who built it, not only that it arrived
  # intact.
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - name: the tag must be the release
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "releasing $tag"
          test "${tag#v}" != "$tag" || { echo "tag $tag does not start with v" >&2; exit 1; }

      # The icon set needs Apple's iconutil, so it is built on the macOS runner
      # and the dmg alongside it rather than skipped.
      - name: the mac icon set
        if: runner.os == 'macos'
        run: |
          brew install librsvg
          scripts/icons.sh

      # One job builds every target. Cross-compiling pure Go is just GOOS/GOARCH,
      # so a matrix would buy parallelism and cost a checksum pass; the whole set
      # takes a couple of minutes and one job keeps checksums.txt coherent.
      - name: build every target
        run: |
          VERSION="${GITHUB_REF_NAME}" COMMIT="$(git rev-parse --short HEAD)" \
            scripts/build.sh

      - name: the assets are there and the stamps are right
        run: |
          ls -l dist
          test -f dist/checksums.txt
          # Every asset must verify, or the release ships something nobody can
          # install with confidence.
          (cd dist && sha256sum -c checksums.txt)

      - name: the binaries say which release they are
        run: |
          mkdir -p /tmp/smoke && tar -xzf dist/wd-darwin-amd64.tar.gz -C /tmp/smoke
          /tmp/smoke/wd --version | grep -F "${GITHUB_REF_NAME}"
          test -f /tmp/smoke/wd.1
          unzip -l dist/wd-windows-amd64.zip | grep -q 'wd.exe'
          unzip -l dist/wd-windows-amd64.zip | grep -q 'wd.1'

      # The app people double-click: the native macOS app with the matching wd
      # inside, zipped for this runner's architecture (Apple silicon).
      - name: build the mac app
        run: |
          VERSION="${GITHUB_REF_NAME}" COMMIT="$(git rev-parse --short HEAD)" scripts/build-macos.sh
          zip="Work-Director-${GITHUB_REF_NAME}-macos-$(uname -m).zip"
          ditto -c -k --keepParent "dist/Work Director.app" "dist/$zip"
          (cd dist && shasum -a 256 "$zip" > "$zip.sha256" && cat "$zip.sha256" >> checksums.txt)
          "dist/Work Director.app/Contents/MacOS/wd" --version | grep -F "${GITHUB_REF_NAME}"

      - name: build the mac disk image
        run: VERSION="${GITHUB_REF_NAME}" COMMIT="$(git rev-parse --short HEAD)" scripts/dmg.sh

      - name: attest where every asset was built
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/Work-Director-*.zip
            dist/wd-*.tar.gz
            dist/wd-*.zip
            dist/wd-*.dmg

      - name: generate the homebrew formula from what was just published
        run: VERSION="${GITHUB_REF_NAME}" scripts/formula.sh

      - name: the formula has no build dependency and names this release
        run: |
          grep -F "${GITHUB_REF_NAME}" scripts/homebrew/wd.rb
          ! grep -q 'depends_on' scripts/homebrew/wd.rb

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -l
          # A tag with a suffix (v1.0.0-rc.1) is a prerelease: offered, never "latest".
          pre=(); case "${GITHUB_REF_NAME}" in *-*) pre=(--prerelease);; esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            "${pre[@]}" \
            dist/Work-Director-*.zip \
            dist/wd-*.tar.gz \
            dist/wd-*.zip \
            dist/wd-*.dmg \
            assets/icon/wd.icns \
            dist/*.sha256 \
            dist/checksums.txt \
            scripts/install.sh \
            scripts/install.ps1

  # The Linux app, built on the oldest Ubuntu it supports (GTK 4.14,
  # libadwaita 1.5) with the matching wd beside it, added to the release the
  # job above published.
  linux-app:
    needs: release
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable

      - name: build the linux app
        run: VERSION="${GITHUB_REF_NAME}" COMMIT="$(git rev-parse --short HEAD)" scripts/build-linux.sh

      - name: the app carries the wd of this release
        run: |
          name="Work-Director-${GITHUB_REF_NAME}-linux-$(uname -m)"
          "dist/$name/lib/work-director/wd" --version | grep -F "${GITHUB_REF_NAME}"
          dpkg-deb -c "dist/$name.deb" | grep 'usr/lib/work-director/wd$' > /dev/null
          (cd dist && sha256sum -c "$name.tar.gz.sha256" "$name.deb.sha256")

      - name: attest where the linux app was built
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/Work-Director-*-linux-*.tar.gz
            dist/Work-Director-*-linux-*.deb

      - name: add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist/Work-Director-*-linux-*.tar.gz \
            dist/Work-Director-*-linux-*.deb \
            dist/Work-Director-*-linux-*.sha256
